# Source: environment/templates/workload-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-web
  namespace: env-payments-web
  labels:
    app.kubernetes.io/name: payments-web
    app.kubernetes.io/instance: payments-web
    app.kubernetes.io/managed-by: ArgoCD
    devaiportal.io/managed: "true"
    devaiportal.io/blueprint: web
    devaiportal.io/owner: "alice@company.com"
    devaiportal.io/team: payments
    devaiportal.io/size: small
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-web
        app.kubernetes.io/instance: payments-web
        app.kubernetes.io/managed-by: ArgoCD
        devaiportal.io/managed: "true"
        devaiportal.io/blueprint: web
        devaiportal.io/owner: "alice@company.com"
        devaiportal.io/team: payments
        devaiportal.io/size: small
    spec:
      serviceAccountName: default-workload
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: docker.io/library/nginx:1.27.2
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
# Source: environment/templates/workload-service.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-web
  namespace: env-payments-web
  labels:
    app.kubernetes.io/name: payments-web
    app.kubernetes.io/instance: payments-web
    app.kubernetes.io/managed-by: ArgoCD
    devaiportal.io/managed: "true"
    devaiportal.io/blueprint: web
    devaiportal.io/owner: "alice@company.com"
    devaiportal.io/team: payments
    devaiportal.io/size: small
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: nginx
  rules:
    - host: payments-web.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments-web
                port:
                  number: 8080
