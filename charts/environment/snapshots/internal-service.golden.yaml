# Source: environment/templates/workload-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: env-orders-api
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: orders-api
    app.kubernetes.io/managed-by: ArgoCD
    devaiportal.io/managed: "true"
    devaiportal.io/blueprint: internal-service
    devaiportal.io/owner: "bob@company.com"
    devaiportal.io/team: ordering
    devaiportal.io/size: medium
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/instance: orders-api
        app.kubernetes.io/managed-by: ArgoCD
        devaiportal.io/managed: "true"
        devaiportal.io/blueprint: internal-service
        devaiportal.io/owner: "bob@company.com"
        devaiportal.io/team: ordering
        devaiportal.io/size: medium
    spec:
      serviceAccountName: default-workload
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/company/orders:v1.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
