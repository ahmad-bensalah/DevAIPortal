# Source: environment/templates/workload-batch.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: analytics-etl
  namespace: env-analytics-etl
  labels:
    app.kubernetes.io/name: analytics-etl
    app.kubernetes.io/instance: analytics-etl
    app.kubernetes.io/managed-by: ArgoCD
    devaiportal.io/managed: "true"
    devaiportal.io/blueprint: batch
    devaiportal.io/owner: "charlie@company.com"
    devaiportal.io/team: data
    devaiportal.io/size: large
spec:
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: analytics-etl
            app.kubernetes.io/instance: analytics-etl
            app.kubernetes.io/managed-by: ArgoCD
            devaiportal.io/managed: "true"
            devaiportal.io/blueprint: batch
            devaiportal.io/owner: "charlie@company.com"
            devaiportal.io/team: data
            devaiportal.io/size: large
        spec:
          serviceAccountName: default-workload
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              image: registry.k8s.io/busybox:1.36.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - echo processing batch analytics
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                limits:
                  cpu: "8"
                  memory: "8Gi"
                requests:
                  cpu: "100m"
                  memory: "128Mi"
              volumeMounts:
                - name: tmp-volume
                  mountPath: /tmp
          volumes:
            - name: tmp-volume
              emptyDir: {}
