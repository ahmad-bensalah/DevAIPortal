{{- $platform := .Files.Get "files/platform.yaml" | fromYaml -}}
{{- $nsName := include "environment.namespace" . -}}
{{- $sizeTier := get $platform.sizes .Values.size -}}

{{- if or (eq .Values.blueprint "web") (eq .Values.blueprint "internal-service") }}
{{- include "environment.validateImage" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ $nsName }}
  labels:
    {{- include "environment.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        {{- include "environment.labels" . | nindent 8 }}
    spec:
      serviceAccountName: default-workload
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.port }}
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: {{ $sizeTier.cpu | quote }}
              memory: {{ $sizeTier.memory | quote }}
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ $nsName }}
  labels:
    {{- include "environment.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - port: {{ .Values.port }}
      targetPort: http
      name: http
      protocol: TCP
---
{{- if and (eq .Values.blueprint "web") .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  namespace: {{ $nsName }}
  labels:
    {{- include "environment.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ $platform.cluster.ingressClass | default "nginx" | quote }}
    {{- if $platform.cluster.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $platform.cluster.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $platform.cluster.ingressClass | default "nginx" }}
  {{- if $platform.cluster.clusterIssuer }}
  tls:
    - hosts:
        - {{ printf "%s.%s" .Values.name ($platform.cluster.baseDomain | default "local") }}
      secretName: {{ printf "%s-tls" .Values.name }}
  {{- end }}
  rules:
    - host: {{ printf "%s.%s" .Values.name ($platform.cluster.baseDomain | default "local") }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  number: {{ .Values.port }}
{{- end }}
{{- end }}
