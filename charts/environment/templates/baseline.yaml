{{- $platform := .Files.Get "files/platform.yaml" | fromYaml -}}
{{- $nsName := include "environment.namespace" . -}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $nsName }}
  labels:
    {{- include "environment.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    {{- include "environment.annotations" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default-workload
  namespace: {{ $nsName }}
  labels:
    {{- include "environment.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- $sizeTier := get $platform.sizes .Values.size }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: {{ $nsName }}
  labels:
    {{- include "environment.labels" . | nindent 4 }}
spec:
  hard:
    limits.cpu: {{ $sizeTier.cpu | quote }}
    limits.memory: {{ $sizeTier.memory | quote }}
    requests.cpu: {{ $sizeTier.cpu | quote }}
    requests.memory: {{ $sizeTier.memory | quote }}
    pods: {{ $sizeTier.pods | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
  namespace: {{ $nsName }}
  labels:
    {{- include "environment.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ $sizeTier.cpu | quote }}
        memory: {{ $sizeTier.memory | quote }}
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: environment-developer
  namespace: {{ $nsName }}
  labels:
    {{- include "environment.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "pods/log", "services", "deployments", "cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward", "pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: environment-developer-binding
  namespace: {{ $nsName }}
  labels:
    {{- include "environment.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: {{ printf "team-%s" .Values.team }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: environment-developer
  apiGroup: rbac.authorization.k8s.io
