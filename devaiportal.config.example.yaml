# DevAIPortal Configuration — Production Reference (Azure & Enterprise GitOps)
# Schema: devaiportal.config.schema.json
# Secrets are managed via environment variables or secret stores (.env / Key Vault / External Secrets).

adapters:
  llm: azure-openai         # azure-openai | openai | anthropic | ollama | mock
  git: github               # github | gitlab | gitea
  notifier: teams           # teams | slack | email | console
  identity: entra-group     # entra-group (Azure AD) | oidc-group | static-user
  secrets: env              # env | kubernetes | external-secrets

cluster:
  context: aks-devaiportal-prod  # kubectl context pointing to target cluster (AKS)
  baseDomain: dev.internal.company.com # Ingress routing domain (<name>.dev.internal.company.com)
  ingressClass: nginx
  ingressNamespace: ingress-nginx
  clusterIssuer: letsencrypt-prod # cert-manager ClusterIssuer for TLS certificates

namespaces:
  prefix: env
  allowedRegistries:
    - mcr.microsoft.com
    - mycompany.azurecr.io
    - docker.io
    - ghcr.io
    - registry.k8s.io

ttl:
  defaultDays: 3
  maxDays: 14

sizes:
  small:
    cpu: "500m"
    memory: "512Mi"
    pods: 5
  medium:
    cpu: "2"
    memory: "2Gi"
    pods: 15
  large:
    cpu: "8"
    memory: "8Gi"
    pods: 30

approval:
  requireAboveSize: medium   # Environments requesting large quotas require approval
  requireAboveTtlDays: 7     # Environments exceeding 7-day TTL require approval

llm:
  model: gpt-4o
  temperature: 0
  maxTokens: 2048

git:
  repo: enterprise-org/devaiportal-gitops
  baseBranch: main
  url: https://github.com
