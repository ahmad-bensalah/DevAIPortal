apiVersion: v1
kind: Pod
metadata:
  name: good-pod-with-resources
  namespace: env-test
spec:
  containers:
    - name: app
      image: docker.io/redis:7.2.4-alpine
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-no-resources
  namespace: env-test
spec:
  containers:
    - name: app
      image: docker.io/redis:7.2.4-alpine
