apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-check-image-registry
policies:
  - ../../registry-allowlist.yaml
resources:
  - resource.yaml
results:
  - policy: check-image-registry
    rule: validate-registries
    resource: good-pod-allowed
    kind: Pod
    result: pass
