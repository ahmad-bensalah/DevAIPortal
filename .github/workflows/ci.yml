name: CI & Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Test, Helm & Policy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Setup Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release-version: v1.12.5

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Validate Example Config against Schema
        run: npx tsx scripts/validate-config.ts .

      - name: Enforce Architecture Decision Records (ADR) Standard
        run: npx tsx scripts/lint-adrs.ts

      - name: Check Platform & Kyverno Policy Drift
        run: npx tsx scripts/render-platform.ts --check

      - name: Helm Lint
        run: helm lint charts/environment

      - name: Run Kyverno Policy Test Suites
        run: kyverno test policies/tests/

      - name: Run Vitest Suites (Schema, Helm Guardrails, Adapters, Eval)
        run: npx vitest run

  security-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
